server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: bhook-identity
  datasource:
    url: jdbc:postgresql://localhost:5432/bhook_identity
    username: bhook_user
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      pool-name: bhook-identity-cp
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    schemas: identity
    default-schema: identity
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true

bhook:
  security:
    jwt:
      issuer: https://identity.local.bhook.app
      audience: bhook-api
      secret: ${BHOOK_JWT_SECRET}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
  outbox:
    poll-ms: 2000
  campus:
    base-url: ${BHOOK_CAMPUS_BASE_URL:http://localhost:8083}
  bootstrap:
    admin-email: ${BHOOK_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BHOOK_BOOTSTRAP_ADMIN_PASSWORD:}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    acks: all
    properties:
      enable.idempotence: true
      max.in.flight.requests.per.connection: 5
      retries: 10

app:
  name: Bhook Identity Service
  environment: ${APP_ENV:local}
