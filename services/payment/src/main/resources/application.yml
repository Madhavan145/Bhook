server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: bhook-payment
  datasource:
    url: jdbc:postgresql://localhost:5432/bhook_payment
    username: bhook_user
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

bhook:
  security:
    jwt:
      issuer: https://identity.local.bhook.app
      audience: bhook-api
      secret: ${BHOOK_JWT_SECRET}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
  outbox:
    enabled: true
    poll-ms: 2000
  payment:
    provider: ${BHOOK_PAYMENT_PROVIDER:STUB}
    webhook-secret: ${BHOOK_PAYMENT_WEBHOOK_SECRET}
    # Auto-succeed every stub payment attempt until real provider APIs are integrated.
    # Turn off once a real PaymentProvider (Razorpay/Stripe/etc.) replaces the stub.
    auto-succeed-stub-payments: ${BHOOK_PAYMENT_AUTO_SUCCEED_STUB:true}

spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    acks: all
    properties:
      enable.idempotence: true
      max.in.flight.requests.per.connection: 5
      retries: 10
  consumer:
    group-id: bhook-payment
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    auto-offset-reset: earliest
    enable-auto-commit: false
  listener:
    ack-mode: RECORD

app:
  name: Bhook Payment Service
  environment: ${APP_ENV:local}
